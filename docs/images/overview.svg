<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <rect width="1000" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1d2320"/>
    </marker>
  </defs>

  <!-- antenna + RTL-SDR -->
  <line x1="70" y1="40" x2="70" y2="110" stroke="#1d2320" stroke-width="3"/>
  <path d="M55 40 L70 60 L85 40" fill="none" stroke="#1d2320" stroke-width="3"/>
  <rect x="20" y="110" width="110" height="80" rx="12" fill="#1d2320"/>
  <text x="75" y="147" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">RTL-SDR</text>
  <text x="75" y="170" text-anchor="middle" font-size="12" fill="#c9cfca">V3 / V4</text>

  <line x1="130" y1="150" x2="228" y2="150" stroke="#1d2320" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="180" y="138" text-anchor="middle" font-size="13" fill="#1d2320">USB 2.0</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#5d6762">4 jumper wires</text>

  <!-- board -->
  <rect x="230" y="40" width="380" height="220" rx="14" fill="#f5f6f3" stroke="#1d2320" stroke-width="2"/>
  <text x="420" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#1d2320">Ai-M61-32S-Kit (BL618)</text>
  <g font-size="13" fill="#1d2320">
    <rect x="250" y="90" width="160" height="40" rx="6" fill="#ffffff" stroke="#c9cfca"/>
    <text x="330" y="115" text-anchor="middle">USB host + librtlsdr</text>
    <rect x="250" y="142" width="160" height="40" rx="6" fill="#ffffff" stroke="#c9cfca"/>
    <text x="330" y="167" text-anchor="middle">1.75 MB PSRAM buffer</text>
    <rect x="430" y="90" width="160" height="40" rx="6" fill="#ffffff" stroke="#c9cfca"/>
    <text x="510" y="115" text-anchor="middle">rtl_tcp  port 1234</text>
    <rect x="430" y="142" width="160" height="40" rx="6" fill="#ffffff" stroke="#c9cfca"/>
    <text x="510" y="167" text-anchor="middle">rtl_udp  port 1235</text>
  </g>
  <text x="420" y="212" text-anchor="middle" font-size="12" fill="#5d6762">Own hotspot SDR-Bridge-XXXX (192.168.7.1)</text>
  <text x="420" y="232" text-anchor="middle" font-size="12" fill="#5d6762">or joins your phone's hotspot · rtlsdr.local either way</text>

  <!-- power -->
  <rect x="345" y="285" width="150" height="34" rx="8" fill="#ffffff" stroke="#5d6762" stroke-dasharray="4 3"/>
  <text x="420" y="307" text-anchor="middle" font-size="12" fill="#5d6762">Power bank / charger ≥ 1 A</text>
  <line x1="420" y1="285" x2="420" y2="262" stroke="#5d6762" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="430" y="278" font-size="11" fill="#5d6762">Type-C</text>

  <!-- wifi -->
  <line x1="610" y1="150" x2="768" y2="150" stroke="#1d2320" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="690" y="138" text-anchor="middle" font-size="13" fill="#1d2320">Wi-Fi 2.4 GHz</text>
  <text x="690" y="172" text-anchor="middle" font-size="12" fill="#5d6762">no jailbreak, no MFi</text>

  <!-- phone -->
  <rect x="770" y="45" width="120" height="210" rx="22" fill="#ffffff" stroke="#1d2320" stroke-width="3"/>
  <rect x="808" y="55" width="44" height="10" rx="5" fill="#1d2320"/>
  <text x="830" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2320">iPhone</text>
  <text x="830" y="165" text-anchor="middle" font-size="12" fill="#5d6762">any rtl_tcp</text>
  <text x="830" y="182" text-anchor="middle" font-size="12" fill="#5d6762">SDR app</text>
  <text x="945" y="140" text-anchor="middle" font-size="12" fill="#5d6762">iPad, Mac,</text>
  <text x="945" y="158" text-anchor="middle" font-size="12" fill="#5d6762">or SDR++</text>
  <text x="945" y="176" text-anchor="middle" font-size="12" fill="#5d6762">on a PC</text>
</svg>
